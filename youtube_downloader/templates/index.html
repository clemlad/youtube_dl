<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicDL</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d12;
      --s1:       #13131c;
      --s2:       #1a1a26;
      --s3:       #222232;
      --border:   #22223a;
      --border2:  #2e2e45;
      --text:     #dcdcec;
      --text2:    #8080a0;
      --text3:    #44445a;
      --accent:   #e03050;
      --accent2:  #ff5070;
      --success:  #22c55e;
      --r:        10px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,13,18,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
    }
    .header-inner {
      max-width: 940px; margin: 0 auto;
      display: flex; align-items: center; gap: 1rem;
    }
    .logo {
      font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent2), #a040e0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      white-space: nowrap; flex-shrink: 0;
    }
    .search-wrap { display: flex; flex: 1; gap: 0.5rem; }
    .search-wrap input {
      flex: 1; padding: 0.6rem 1rem; border-radius: 8px;
      border: 1px solid var(--border2); background: var(--s2);
      color: var(--text); font-size: 0.9rem; outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input::placeholder { color: var(--text3); }
    .search-wrap input:focus { border-color: var(--accent); }
    .btn {
      padding: 0.6rem 1.2rem; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; font-size: 0.86rem;
      font-weight: 700; cursor: pointer; white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }
    .btn.ghost {
      background: none; border: 1px solid var(--border2); color: var(--text2);
    }
    .btn.ghost:hover { border-color: var(--border2); background: var(--s2); opacity: 1; }

    /* ── Main ─────────────────────────────────────────────────── */
    main { max-width: 940px; margin: 0 auto; padding: 1.5rem; }

    /* ── Section label ── */
    .label {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--text3); font-weight: 700; margin-bottom: 0.85rem;
    }

    /* ── Search results ─────────────────────────────────────── */
    #results-section { margin-bottom: 2rem; }
    #results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.75rem;
    }
    .card {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden; display: flex;
      flex-direction: column; transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 10px 28px #00000050; }
    .card.queued { opacity: 0.55; border-color: var(--success)40; }

    .card-thumb {
      position: relative; aspect-ratio: 16/9;
      overflow: hidden; background: var(--s3); flex-shrink: 0;
    }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-thumb::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 45%, rgba(0,0,0,0.75));
      pointer-events: none;
    }
    .card-dur {
      position: absolute; bottom: 6px; right: 8px; z-index: 1;
      background: rgba(0,0,0,0.72); color: #e0e0e0;
      font-size: 0.68rem; font-weight: 600;
      padding: 0.1rem 0.4rem; border-radius: 4px;
    }

    .card-body { padding: 0.65rem 0.75rem; flex: 1; display: flex; flex-direction: column; gap: 0.2rem; }
    .card-title {
      font-size: 0.84rem; font-weight: 600; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; line-height: 1.4;
    }
    .card-channel { font-size: 0.73rem; color: var(--text2); }
    .card-views   { font-size: 0.7rem;  color: var(--text3); }

    .card-foot { padding: 0 0.75rem 0.75rem; }
    .card-foot button {
      width: 100%; padding: 0.45rem; border-radius: 7px; border: none;
      background: var(--accent); color: #fff; font-size: 0.8rem;
      font-weight: 700; cursor: pointer; transition: opacity 0.2s;
    }
    .card-foot button:hover { opacity: 0.85; }
    .card.queued .card-foot button { background: var(--success); cursor: default; }

    #search-loading,
    #search-empty { text-align: center; color: var(--text3); padding: 2rem; font-size: 0.88rem; display: none; }

    /* ── Playlist search results ────────────────────────────── */
    #pl-results-section { margin-bottom: 2rem; }
    #pl-results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.75rem;
    }

    .pl-card-result {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden; display: flex;
      flex-direction: column; transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .pl-card-result:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 10px 28px #00000050; }
    .pl-card-result.downloading { opacity: 0.55; border-color: #a040e055; }

    .pl-thumb {
      position: relative; aspect-ratio: 16/9;
      overflow: hidden; background: var(--s3); flex-shrink: 0;
    }
    .pl-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pl-thumb-fallback {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #3010a0, #a040e0);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
    }
    .pl-thumb::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.75));
      pointer-events: none;
    }
    .pl-count-badge {
      position: absolute; bottom: 6px; right: 8px; z-index: 1;
      background: rgba(0,0,0,0.75); color: #e0e0e0;
      font-size: 0.68rem; font-weight: 600;
      padding: 0.15rem 0.5rem; border-radius: 4px;
      display: flex; align-items: center; gap: 0.3rem;
    }

    .pl-card-body { padding: 0.65rem 0.75rem; flex: 1; display: flex; flex-direction: column; gap: 0.2rem; }
    .pl-card-title {
      font-size: 0.88rem; font-weight: 700; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; line-height: 1.4;
    }
    .pl-card-channel { font-size: 0.73rem; color: var(--text2); }

    .pl-card-foot { padding: 0 0.75rem 0.75rem; }
    .pl-card-foot button {
      width: 100%; padding: 0.5rem; border-radius: 7px; border: none;
      background: linear-gradient(135deg, #7020c0, #a040e0);
      color: #fff; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    }
    .pl-card-foot button:hover { opacity: 0.85; }
    .pl-card-result.downloading .pl-card-foot button { background: #555; cursor: default; }

    /* ── Tabs ─────────────────────────────────────────────────── */
    .tabs {
      display: flex; gap: 0.1rem; border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }
    .tab {
      padding: 0.6rem 1.2rem; border: none; background: none;
      color: var(--text2); font-size: 0.88rem; font-weight: 600; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      border-radius: 6px 6px 0 0; transition: color 0.18s, border-color 0.18s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }

    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Library ─────────────────────────────────────────────── */
    #lib-list { display: flex; flex-direction: column; }
    .track {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.55rem 0.5rem; border-radius: 8px;
      transition: background 0.15s; position: relative;
    }
    .track + .track { border-top: 1px solid var(--border); }
    .track:hover { background: var(--s2); }
    .track-num { font-size: 0.73rem; color: var(--text3); width: 22px; text-align: center; flex-shrink: 0; }
    .track-box {
      width: 34px; height: 34px; border-radius: 7px;
      background: var(--s3); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 0.9rem; color: var(--text3);
    }
    .track-title {
      flex: 1; font-size: 0.88rem; font-weight: 500; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track audio {
      height: 28px; width: 185px; flex-shrink: 0; accent-color: var(--accent);
    }
    .track-btns { display: flex; gap: 0.3rem; flex-shrink: 0; }
    .icon-btn {
      background: none; border: 1px solid var(--border2); color: var(--text2);
      width: 30px; height: 30px; border-radius: 7px; cursor: pointer; font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: border-color 0.18s, color 0.18s, background 0.18s;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: #e0305012; }
    #lib-empty { text-align: center; color: var(--text3); padding: 3.5rem 1rem; font-size: 0.88rem; }

    /* ── Playlists ───────────────────────────────────────────── */
    #pl-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 0.75rem; margin-bottom: 1rem;
    }

    .pl-card { background: var(--s1); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .pl-card:hover { border-color: var(--border2); }

    .pl-head {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 1rem; cursor: pointer; user-select: none;
    }
    .pl-head:hover { background: var(--s2); }
    .pl-arrow { font-size: 0.65rem; color: var(--text3); transition: transform 0.2s; flex-shrink: 0; }
    .pl-card.open .pl-arrow { transform: rotate(90deg); }

    .pl-icon {
      width: 40px; height: 40px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
    }
    .pl-meta { flex: 1; min-width: 0; }
    .pl-name { font-size: 0.9rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-sub  { font-size: 0.72rem; color: var(--text2); margin-top: 0.1rem; }
    .pl-del  { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 0.9rem; padding: 0.3rem; border-radius: 6px; flex-shrink: 0; transition: color 0.18s; }
    .pl-del:hover { color: var(--accent); }

    .pl-body { display: none; border-top: 1px solid var(--border); }
    .pl-card.open .pl-body { display: block; }

    .pl-track {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 1rem; transition: background 0.15s;
    }
    .pl-track + .pl-track { border-top: 1px solid var(--border); }
    .pl-track:hover { background: var(--s2); }
    .pl-t-icon  { color: var(--text3); font-size: 0.85rem; flex-shrink: 0; }
    .pl-t-name  { flex: 1; font-size: 0.83rem; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-track audio { height: 26px; width: 155px; flex-shrink: 0; accent-color: var(--accent); }
    .pl-rm { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 0.85rem; flex-shrink: 0; transition: color 0.18s; padding: 0 0.2rem; }
    .pl-rm:hover { color: var(--accent); }
    .pl-empty-msg { padding: 1rem; text-align: center; font-size: 0.82rem; color: var(--text3); }

    #pl-create-form {
      display: none; gap: 0.5rem; margin-bottom: 0.75rem;
      padding: 0.8rem; background: var(--s2);
      border: 1px solid var(--border); border-radius: var(--r);
    }
    #pl-create-form input {
      flex: 1; padding: 0.55rem 0.8rem; border-radius: 7px;
      border: 1px solid var(--border2); background: var(--s3);
      color: var(--text); font-size: 0.88rem; outline: none;
    }
    #pl-create-form input:focus { border-color: var(--accent); }
    .pl-new-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      width: 100%; padding: 0.65rem; border-radius: 8px;
      border: 1.5px dashed var(--border2); background: none;
      color: var(--text2); font-size: 0.85rem; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .pl-new-btn:hover { border-color: var(--accent); color: var(--accent); }

    #pl-global-empty { text-align: center; color: var(--text3); padding: 3rem 1rem; font-size: 0.88rem; grid-column: 1/-1; }

    /* ── Playlist popup ─────────────────────────────────────── */
    #pl-popup {
      position: fixed; z-index: 500; display: none;
      background: var(--s2); border: 1px solid var(--border2);
      border-radius: 12px; padding: 0.75rem;
      box-shadow: 0 16px 40px rgba(0,0,0,0.7);
      min-width: 210px; max-width: 280px;
    }
    .pp-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text3); font-weight: 700; margin-bottom: 0.5rem; }
    .pp-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0.5rem; border-radius: 6px; cursor: pointer;
      font-size: 0.84rem; color: var(--text2); transition: background 0.15s;
    }
    .pp-item:hover { background: var(--s3); }
    .pp-check { width: 16px; font-size: 0.78rem; color: var(--success); }
    .pp-sep { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; }
    .pp-new { display: flex; gap: 0.4rem; }
    .pp-new input {
      flex: 1; padding: 0.35rem 0.6rem; border-radius: 6px;
      border: 1px solid var(--border2); background: var(--s3);
      color: var(--text); font-size: 0.8rem; outline: none;
    }
    .pp-new input:focus { border-color: var(--accent); }
    .pp-new button {
      padding: 0.35rem 0.65rem; border-radius: 6px; border: none;
      background: var(--accent); color: #fff; font-size: 0.78rem; font-weight: 700; cursor: pointer;
    }
    #pp-empty { font-size: 0.8rem; color: var(--text3); padding: 0.3rem 0.5rem; }

    /* ── Download bar ───────────────────────────────────────── */
    #dl-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 300;
      background: var(--s2); border-top: 1px solid var(--border2);
      box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      padding: 0.75rem 1.5rem;
    }
    #dl-bar.visible { transform: translateY(0); }
    .dl-inner { max-width: 940px; margin: 0 auto; display: flex; align-items: center; gap: 0.9rem; }

    .dl-spinner {
      width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
      border: 2.5px solid var(--border2); border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .dl-info { flex: 1; min-width: 0; }
    .dl-title { font-size: 0.88rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dl-sub   { font-size: 0.73rem; color: var(--text3); margin-top: 0.1rem; }

    #dl-stop-btn {
      background: none; border: 1px solid var(--border2); color: var(--text2);
      width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
      font-size: 1rem; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.18s, color 0.18s, background 0.18s;
    }
    #dl-stop-btn:hover { border-color: var(--accent); color: var(--accent); background: #e0305015; }
    #dl-stop-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .dl-badge {
      background: var(--s3); border: 1px solid var(--border);
      color: var(--accent); font-size: 0.75rem; font-weight: 700;
      padding: 0.2rem 0.55rem; border-radius: 20px; flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <span class="logo">♫ MusicDL</span>
    <div class="search-wrap">
      <input id="query" type="text" placeholder="Artiste, titre, album…" autocomplete="off" />
      <button class="btn" id="search-btn" onclick="doSearch()">Rechercher</button>
    </div>
  </div>
</header>

<main>

  <!-- Video results -->
  <div id="results-section" style="display:none">
    <div class="label" id="results-label">Résultats</div>
    <div id="search-loading">Recherche en cours…</div>
    <div id="search-empty">Aucun résultat trouvé.</div>
    <div id="results-grid"></div>
  </div>

  <!-- Playlist results -->
  <div id="pl-results-section" style="display:none">
    <div class="label">Playlists YouTube</div>
    <div id="pl-results-grid"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="library"   onclick="switchTab('library')">Bibliothèque</button>
    <button class="tab"        data-tab="playlists" onclick="switchTab('playlists')">Playlists</button>
  </div>

  <!-- Library -->
  <div id="tab-library" class="panel active">
    <div id="lib-list"></div>
    <div id="lib-empty">Aucune musique téléchargée pour l'instant.</div>
  </div>

  <!-- Playlists -->
  <div id="tab-playlists" class="panel">
    <div id="pl-grid"></div>
    <div id="pl-create-form">
      <input id="pl-name-input" type="text" placeholder="Nom de la playlist…" />
      <button class="btn" onclick="confirmCreatePlaylist()">Créer</button>
    </div>
    <button class="pl-new-btn" onclick="toggleCreateForm()">＋ Nouvelle playlist</button>
  </div>

</main>

<!-- Download bar (bottom) -->
<div id="dl-bar">
  <div class="dl-inner">
    <div class="dl-spinner"></div>
    <div class="dl-info">
      <div class="dl-title" id="dl-title">—</div>
      <div class="dl-sub"   id="dl-sub"></div>
    </div>
    <div class="dl-badge" id="dl-badge" style="display:none"></div>
    <div class="dl-badge" id="dl-pl-badge" style="display:none;background:linear-gradient(135deg,#7020c0,#a040e0);border:none;color:#fff"></div>
    <button id="dl-stop-btn" onclick="stopDownload()" title="Arrêter le téléchargement">✕</button>
  </div>
</div>

<!-- Playlist popup -->
<div id="pl-popup">
  <div class="pp-label">Ajouter à une playlist</div>
  <div id="pp-list"></div>
  <div id="pp-empty" style="display:none">Aucune playlist encore.</div>
  <hr class="pp-sep" />
  <div class="pp-new">
    <input id="pp-new-input" type="text" placeholder="Nouvelle playlist…" />
    <button onclick="createFromPopup()">Créer</button>
  </div>
</div>

<script>
  /* ── State ── */
  const queuedUrls      = new Set();
  const dlQueue         = [];
  let processing        = false;
  let searchResults     = [];
  let plSearchResults   = [];   // playlist search results
  let activePlaylistJob = null; // {jobId, name, done, total, current}
  let popupTrack        = null;
  let playlists         = {};

  /* ── Tabs ── */
  function switchTab(id) {
    document.querySelectorAll(".tab").forEach(b =>
      b.classList.toggle("active", b.dataset.tab === id));
    document.querySelectorAll(".panel").forEach(p =>
      p.classList.toggle("active", p.id === `tab-${id}`));
  }

  /* ── Search ── */
  document.getElementById("query").addEventListener("keydown", e => {
    if (e.key === "Enter") doSearch();
  });

  async function doSearch() {
    const q = document.getElementById("query").value.trim();
    if (!q) return;

    const btn     = document.getElementById("search-btn");
    const section = document.getElementById("results-section");
    const grid    = document.getElementById("results-grid");
    const loading = document.getElementById("search-loading");
    const empty   = document.getElementById("search-empty");
    const plSec   = document.getElementById("pl-results-section");
    const plGrid  = document.getElementById("pl-results-grid");

    btn.disabled = true;
    section.style.display = "block"; plSec.style.display = "none";
    loading.style.display = "block"; empty.style.display = "none";
    grid.innerHTML = ""; plGrid.innerHTML = "";
    searchResults = []; plSearchResults = [];

    // Run both searches in parallel
    const [videos, pls] = await Promise.all([
      fetch(`/search?q=${encodeURIComponent(q)}`).then(r => r.json()).catch(() => []),
      fetch(`/search-playlists?q=${encodeURIComponent(q)}`).then(r => r.json()).catch(() => []),
    ]);

    loading.style.display = "none";

    if (!videos.length) {
      empty.style.display = "block";
    } else {
      searchResults = videos;
      document.getElementById("results-label").textContent = `Résultats pour "${q}"`;
      grid.innerHTML = videos.map((r, i) => buildCard(r, i)).join("");
    }

    if (pls.length) {
      plSearchResults = pls;
      plSec.style.display = "block";
      plGrid.innerHTML = pls.map((p, i) => buildPlaylistCard(p, i)).join("");
    }

    btn.disabled = false;
  }

  function buildCard(r, idx) {
    const already = queuedUrls.has(r.url);
    return `
      <div class="card${already ? " queued" : ""}" id="card-${r.id}">
        <div class="card-thumb">
          <img src="${r.thumbnail}" alt="" loading="lazy" onerror="this.style.display='none'"/>
          ${r.duration ? `<span class="card-dur">${esc(r.duration)}</span>` : ""}
        </div>
        <div class="card-body">
          <div class="card-title"  title="${esc(r.title)}">${esc(r.title)}</div>
          ${r.channel ? `<div class="card-channel">${esc(r.channel)}</div>` : ""}
          ${r.views   ? `<div class="card-views">${esc(r.views)}</div>` : ""}
        </div>
        <div class="card-foot">
          <button onclick="addToQueue(${idx})" ${already ? "disabled" : ""}>
            ${already ? "✓ Ajouté à la file" : "⬇  Télécharger"}
          </button>
        </div>
      </div>`;
  }

  function buildPlaylistCard(p, idx) {
    const thumbHtml = p.thumbnail
      ? `<img src="${esc(p.thumbnail)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
         <div class="pl-thumb-fallback" style="display:none">🎵</div>`
      : `<div class="pl-thumb-fallback">🎵</div>`;
    return `
      <div class="pl-card-result" id="plr-${p.id}">
        <div class="pl-thumb">
          ${thumbHtml}
          <span class="pl-count-badge">🎵 ${esc(String(p.count))} titres</span>
        </div>
        <div class="pl-card-body">
          <div class="pl-card-title" title="${esc(p.title)}">${esc(p.title)}</div>
          ${p.channel ? `<div class="pl-card-channel">${esc(p.channel)}</div>` : ""}
        </div>
        <div class="pl-card-foot">
          <button onclick="downloadPlaylist(${idx})">
            <span>⬇</span> Télécharger la playlist
          </button>
        </div>
      </div>`;
  }

  async function downloadPlaylist(idx) {
    const p = plSearchResults[idx];
    if (!p) return;

    const card = document.getElementById(`plr-${p.id}`);
    if (card) {
      card.classList.add("downloading");
      const btn = card.querySelector("button");
      if (btn) { btn.innerHTML = "<span>⏳</span> Téléchargement en cours…"; btn.disabled = true; }
    }

    try {
      const res  = await fetch("/download-playlist", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: p.url, name: p.title }),
      });
      const data = await res.json();
      if (data.job_id) pollPlaylistJob(data.job_id, p.title, p.id);
    } catch {
      if (card) card.classList.remove("downloading");
    }
  }

  async function pollPlaylistJob(jobId, name, cardId) {
    activePlaylistJob = { jobId, name, done: 0, total: 0, current: "" };
    updateBar();

    while (true) {
      await sleep(2000);
      try {
        const d = await fetch(`/playlist-status/${jobId}`).then(r => r.json());
        activePlaylistJob = { jobId, name: d.name || name, done: d.done, total: d.total, current: d.current };
        updateBar();

        if (d.status === "done" || d.status === "error" || d.status === "cancelled") {
          activePlaylistJob = null;
          document.getElementById("dl-stop-btn").disabled = false;
          updateBar();
          if (d.status !== "error") { loadLibrary(); loadPlaylists(); }
          const card = document.getElementById(`plr-${cardId}`);
          if (card) {
            card.classList.remove("downloading");
            const btn = card.querySelector("button");
            if (btn) {
              if (d.status === "done") {
                btn.innerHTML = "<span>✓</span> Playlist téléchargée !";
                btn.disabled  = true;
              } else {
                const idx = plSearchResults.findIndex(p => p.id === cardId);
                btn.innerHTML = d.status === "cancelled"
                  ? "<span>↺</span> Relancer le téléchargement"
                  : "<span>↺</span> Réessayer";
                btn.disabled  = false;
                if (idx !== -1) btn.setAttribute("onclick", `downloadPlaylist(${idx})`);
              }
            }
          }
          break;
        }
      } catch {
        activePlaylistJob = null; updateBar(); break;
      }
    }
  }

  /* ── Queue ── */
  function addToQueue(idx) {
    const r = searchResults[idx];
    if (!r || queuedUrls.has(r.url)) return;
    queuedUrls.add(r.url);
    dlQueue.push({ id: r.id, title: r.title, url: r.url, status: "waiting" });
    updateBar(); processQueue();
    const card = document.getElementById(`card-${r.id}`);
    if (card) {
      card.classList.add("queued");
      const b = card.querySelector("button");
      if (b) { b.textContent = "✓ Ajouté à la file"; b.disabled = true; }
    }
  }

  function updateBar() {
    const bar     = document.getElementById("dl-bar");
    const active  = dlQueue.find(i => i.status === "downloading");
    const waiting = dlQueue.filter(i => i.status === "waiting");
    const hasPl   = activePlaylistJob != null;
    const show    = !!(active || waiting.length || hasPl);
    bar.classList.toggle("visible", show);

    const badge   = document.getElementById("dl-badge");
    const plBadge = document.getElementById("dl-pl-badge");

    if (hasPl) {
      const j = activePlaylistJob;
      const progress = j.total ? `${j.done}/${j.total}` : "…";
      document.getElementById("dl-title").textContent  = j.current || j.name;
      document.getElementById("dl-sub").textContent    = `Playlist : ${j.name} — ${progress}`;
      plBadge.style.display = "block";
      plBadge.textContent   = `🎵 ${progress}`;
      badge.style.display   = "none";
    } else {
      const current = active || waiting[0];
      document.getElementById("dl-title").textContent = current?.title ?? "—";
      document.getElementById("dl-sub").textContent   = active ? "Téléchargement en cours…" : "En attente…";
      plBadge.style.display = "none";
      if (waiting.length > 0) {
        badge.style.display = "block";
        badge.textContent   = `+${waiting.length}`;
      } else {
        badge.style.display = "none";
      }
    }
  }

  async function processQueue() {
    if (processing) return;
    const next = dlQueue.find(i => i.status === "waiting");
    if (!next) { updateBar(); return; }
    processing = true; next.status = "downloading"; updateBar();
    let alreadyDone = false;
    try {
      const res  = await fetch("/download", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: next.url, title: next.title }),
      });
      const data = await res.json();
      if (!res.ok || data.error) {
        next.status = "error";
      } else if (data.already_done) {
        next.status = "done";
        alreadyDone = true;
      } else {
        next.jobId = data.job_id;
        await pollUntilDone(next, data.job_id);
      }
    } catch { next.status = "error"; }
    processing = false; updateBar();
    if (next.status === "done") loadLibrary();
    if (next.status === "cancelled" || next.status === "error") restoreCard(next);
    const card = document.getElementById(`card-${next.id}`);
    const btn  = card?.querySelector(".card-foot button");
    if (btn) {
      if      (alreadyDone)            btn.textContent = "✓ Déjà téléchargé";
      else if (next.status === "done") btn.textContent = "✓ Téléchargé";
    }
    processQueue();
  }

  function restoreCard(item) {
    queuedUrls.delete(item.url);
    const card = document.getElementById(`card-${item.id}`);
    if (!card) return;
    card.classList.remove("queued");
    const b = card.querySelector(".card-foot button");
    if (!b) return;
    b.textContent = "⬇  Télécharger";
    b.disabled    = false;
    const idx = searchResults.findIndex(r => r.url === item.url);
    if (idx !== -1) b.setAttribute("onclick", `addToQueue(${idx})`);
  }

  async function pollUntilDone(item, jobId) {
    while (true) {
      await sleep(1500);
      try {
        const d = await fetch(`/status/${jobId}`).then(r => r.json());
        if (d.status === "done")      { item.status = "done";      return; }
        if (d.status === "error")     { item.status = "error";     return; }
        if (d.status === "cancelled") { item.status = "cancelled"; return; }
      } catch { item.status = "error"; return; }
    }
  }

  async function stopDownload() {
    const btn = document.getElementById("dl-stop-btn");
    btn.disabled = true;

    if (activePlaylistJob) {
      await fetch(`/cancel-playlist/${activePlaylistJob.jobId}`, { method: "POST" }).catch(() => {});
      return;
    }

    const active = dlQueue.find(i => i.status === "downloading");
    if (active?.jobId) {
      await fetch(`/cancel/${active.jobId}`, { method: "POST" }).catch(() => {});
    }
    const firstWaiting = dlQueue.findIndex(i => i.status === "waiting");
    if (firstWaiting !== -1) dlQueue.splice(firstWaiting).forEach(item => restoreCard(item));

    btn.disabled = false;
  }

  /* ── Library ── */
  async function loadLibrary() {
    const list  = document.getElementById("lib-list");
    const empty = document.getElementById("lib-empty");
    try {
      const files = await fetch("/library").then(r => r.json());
      if (!files.length) { list.innerHTML = ""; empty.style.display = "block"; return; }
      empty.style.display = "none";
      list.innerHTML = files.map((f, i) => {
        const name = f.replace(/\.mp3$/i, "");
        const url  = `/music/${encodeURIComponent(f)}`;
        return `
          <div class="track" data-file="${esc(f)}">
            <span class="track-num">${i + 1}</span>
            <div class="track-box">♪</div>
            <span class="track-title" title="${esc(name)}">${esc(name)}</span>
            <audio controls src="${url}" preload="none"></audio>
            <div class="track-btns">
              <button class="icon-btn" onclick="openPopup(this)" title="Ajouter à une playlist">📁</button>
              <a class="icon-btn" href="${url}" download="${esc(f)}" title="Télécharger">⬇</a>
            </div>
          </div>`;
      }).join("");
    } catch { empty.style.display = "block"; }
  }

  /* ── Popup ── */
  const popup = document.getElementById("pl-popup");

  function openPopup(btn) {
    const row = btn.closest(".track");
    popupTrack = row?.dataset?.file ?? null;
    if (!popupTrack) return;

    popup.style.display = "block";
    const rect = btn.getBoundingClientRect();
    let top  = rect.bottom + window.scrollY + 6;
    let left = rect.left   + window.scrollX;
    const pw = popup.offsetWidth || 230;
    if (left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
    popup.style.top  = top  + "px";
    popup.style.left = left + "px";

    document.getElementById("pp-new-input").value = "";
    renderPopup();
  }

  function closePopup() { popup.style.display = "none"; popupTrack = null; }
  document.addEventListener("click", e => {
    if (!popup.contains(e.target) && !e.target.closest(".icon-btn[onclick]")) closePopup();
  });

  async function renderPopup() {
    playlists = await fetch("/playlists").then(r => r.json());
    const names = Object.keys(playlists);
    const list  = document.getElementById("pp-list");
    const empty = document.getElementById("pp-empty");
    if (!names.length) { list.innerHTML = ""; empty.style.display = "block"; return; }
    empty.style.display = "none";
    list.innerHTML = names.map((name, i) => {
      const inList = playlists[name].includes(popupTrack);
      return `<div class="pp-item ${inList ? "in-list" : ""}" onclick="toggleInPlaylist(${i})">
        <span class="pp-check">${inList ? "✓" : ""}</span>
        <span>${esc(name)}</span>
      </div>`;
    }).join("");
  }

  async function toggleInPlaylist(idx) {
    const name   = Object.keys(playlists)[idx];
    const inList = playlists[name].includes(popupTrack);
    await fetch(`/playlists/${encodeURIComponent(name)}/tracks`, {
      method: inList ? "DELETE" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ track: popupTrack }),
    });
    await renderPopup(); loadPlaylists();
  }

  async function createFromPopup() {
    const input = document.getElementById("pp-new-input");
    const name  = input.value.trim();
    if (!name) return;
    const res = await fetch("/playlists", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    if (res.ok) {
      input.value = "";
      await fetch(`/playlists/${encodeURIComponent(name)}/tracks`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ track: popupTrack }),
      });
      await renderPopup(); loadPlaylists();
    }
  }

  /* ── Playlists ── */
  const gradients = [
    "135deg,#e03050,#8020c0", "135deg,#e06020,#e03050",
    "135deg,#2060e0,#8020c0", "135deg,#20b060,#2060e0",
    "135deg,#e0a020,#e06020", "135deg,#c020a0,#2060e0",
  ];

  async function loadPlaylists() {
    playlists = await fetch("/playlists").then(r => r.json());
    const names = Object.keys(playlists);
    const grid  = document.getElementById("pl-grid");
    if (!names.length) {
      grid.innerHTML = `<div id="pl-global-empty">Crée ta première playlist !</div>`; return;
    }
    grid.innerHTML = names.map((name, pi) => {
      const tracks = playlists[name];
      const body   = tracks.length
        ? tracks.map((f, ti) => {
            const n = f.replace(/\.mp3$/i, "");
            const u = `/music/${encodeURIComponent(f)}`;
            return `<div class="pl-track">
              <span class="pl-t-icon">♪</span>
              <span class="pl-t-name" title="${esc(n)}">${esc(n)}</span>
              <audio controls src="${u}" preload="none"></audio>
              <button class="pl-rm" onclick="rmFromPl(${pi},${ti})" title="Retirer">✕</button>
            </div>`;
          }).join("")
        : `<div class="pl-empty-msg">Aucune musique — ajoute-en depuis la bibliothèque !</div>`;

      return `<div class="pl-card" id="pl-${pi}">
        <div class="pl-head" onclick="togglePl(${pi})">
          <span class="pl-arrow">▶</span>
          <div class="pl-icon" style="background:linear-gradient(${gradients[pi % gradients.length]})">🎵</div>
          <div class="pl-meta">
            <div class="pl-name">${esc(name)}</div>
            <div class="pl-sub">${tracks.length} titre${tracks.length !== 1 ? "s" : ""}</div>
          </div>
          <button class="pl-del" onclick="delPl(event,${pi})" title="Supprimer">🗑</button>
        </div>
        <div class="pl-body">${body}</div>
      </div>`;
    }).join("");
  }

  function togglePl(idx) { document.getElementById(`pl-${idx}`)?.classList.toggle("open"); }

  async function delPl(e, idx) {
    e.stopPropagation();
    const name = Object.keys(playlists)[idx];
    if (!confirm(`Supprimer "${name}" ?`)) return;
    await fetch(`/playlists/${encodeURIComponent(name)}`, { method: "DELETE" });
    loadPlaylists();
  }

  async function rmFromPl(pi, ti) {
    const name  = Object.keys(playlists)[pi];
    const track = playlists[name][ti];
    await fetch(`/playlists/${encodeURIComponent(name)}/tracks`, {
      method: "DELETE", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ track }),
    });
    loadPlaylists();
  }

  function toggleCreateForm() {
    const form = document.getElementById("pl-create-form");
    const show = form.style.display !== "flex";
    form.style.display = show ? "flex" : "none";
    if (show) document.getElementById("pl-name-input").focus();
  }

  document.getElementById("pl-name-input").addEventListener("keydown", e => {
    if (e.key === "Enter")  confirmCreatePlaylist();
    if (e.key === "Escape") toggleCreateForm();
  });

  async function confirmCreatePlaylist() {
    const input = document.getElementById("pl-name-input");
    const name  = input.value.trim();
    if (!name) return;
    const res = await fetch("/playlists", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    if (res.ok) {
      input.value = "";
      document.getElementById("pl-create-form").style.display = "none";
      loadPlaylists();
    }
  }

  /* ── Helpers ── */
  function esc(s) {
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  loadLibrary();
  loadPlaylists();
</script>
</body>
</html>
